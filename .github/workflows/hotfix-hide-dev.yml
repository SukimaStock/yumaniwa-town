name: Hotfix hide production dev UI

on:
  push:
    branches:
      - hotfix/hide-dev-button-20260814
    paths:
      - .github/workflows/hotfix-hide-dev.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/hide-dev-button-20260814

      - name: Disable production developer mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          text = p.read_text(encoding='utf-8')
          old = 'var DEV_MODE_ENABLED = true;'
          new = 'var DEV_MODE_ENABLED = false;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one DEV_MODE_ENABLED=true, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check main.js

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SukimaStock hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add main.js
          git commit -m 'Hide development controls in production'
          git push origin HEAD:hotfix/hide-dev-button-20260814
