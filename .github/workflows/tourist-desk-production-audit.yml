name: Tourist Desk Production Candidate Audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'works/yumaniwa-tourist-desk/**'
      - 'data/standalone-pages.json'
      - 'tools/standalone-pages.cjs'
      - 'tools/generate-work-search-pages.cjs'
      - 'tools/release-validator.cjs'
      - 'tools/work-lifecycle.cjs'
      - 'sitemap.xml'
      - 'tests/test-tourist-desk-production.mjs'
      - '.github/workflows/tourist-desk-production-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local dependencies, SEO, camera, picking and actual app input fixture
        run: node --test tests/test-tourist-desk-production.mjs works/yumaniwa-tourist-desk/tests/app-input.test.mjs
      - name: Verify generated sitemap and unchanged existing search pages
        run: node tools/generate-work-search-pages.cjs --env production --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window,pumpoko --check
