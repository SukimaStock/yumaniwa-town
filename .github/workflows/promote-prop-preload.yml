name: Promote Town Prop Preload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-prop-preload.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add preload script to production index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="./town-prop-preload.js?v=20260822-1"></script>'
          anchor = '<script src="./data/town-runtime-fixes.js?v=20260822-2"></script>'

          if tag not in text:
              if anchor not in text:
                  raise SystemExit('runtime-fixes anchor not found')
              text = text.replace(anchor, anchor + '\n' + tag, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/promote-prop-preload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/promote-prop-preload.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enable town prop preloading in production'
          git push
