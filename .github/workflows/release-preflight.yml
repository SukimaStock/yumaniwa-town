name: Release preflight

on:
  push:
    branches:
      - staging-release-20260814
    paths:
      - .github/workflows/release-preflight.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: staging-release-20260814

      - name: Check production metadata
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'noindex|nofollow' index.html; then
            echo 'index.html contains noindex/nofollow' >&2
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Check local index references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          root = Path('.')
          missing = []

          class Parser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  value = None
                  if tag == 'script':
                      value = a.get('src')
                  elif tag == 'link':
                      value = a.get('href')
                  if not value:
                      return
                  if value.startswith(('http://', 'https://', '//', 'data:', '#')):
                      return
                  path = unquote(urlsplit(value).path)
                  if not path or path.startswith('/'):
                      return
                  candidate = root / path.lstrip('./')
                  if not candidate.exists():
                      missing.append((tag, value, str(candidate)))

          Parser().feed(Path('index.html').read_text(encoding='utf-8'))
          if missing:
              for item in missing:
                  print('Missing local reference:', item)
              raise SystemExit(1)
          PY

      - name: Check referenced image assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          sources = [
              Path('data/town-maps.js'),
              Path('data/station-plaza-props.js'),
              Path('station-guide-refresh.js'),
          ]
          missing = []
          pattern = re.compile(r'[\"\']([^\"\']+\.(?:png|jpg|jpeg|webp|gif)(?:\?[^\"\']*)?)[\"\']', re.I)

          for source in sources:
              text = source.read_text(encoding='utf-8')
              for raw in pattern.findall(text):
                  if raw.startswith(('http://', 'https://', '//', 'data:')):
                      continue
                  path = unquote(urlsplit(raw).path).lstrip('./')
                  candidate = Path(path)
                  if not candidate.exists():
                      missing.append((str(source), raw, str(candidate)))

          if missing:
              for item in missing:
                  print('Missing image reference:', item)
              raise SystemExit(1)
          PY

      - name: Check web manifests and icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          missing = []
          for manifest in Path('w').glob('*/manifest.webmanifest'):
              data = json.loads(manifest.read_text(encoding='utf-8'))
              for icon in data.get('icons', []):
                  src = icon.get('src')
                  if not src or src.startswith(('http://', 'https://', '//', 'data:')):
                      continue
                  path = unquote(urlsplit(src).path)
                  candidate = (manifest.parent / path).resolve()
                  if not candidate.exists():
                      missing.append((str(manifest), src, str(candidate)))
          if missing:
              for item in missing:
                  print('Missing manifest icon:', item)
              raise SystemExit(1)
          PY
