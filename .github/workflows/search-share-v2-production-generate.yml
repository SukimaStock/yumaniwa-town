name: Temporary Search Share v2 Production Generation

on:
  push:
    branches:
      - "release/search-share-v2"
    paths:
      - "data/work-search-meta.js"
      - "tools/generate-work-search-pages.cjs"
      - ".github/workflows/search-share-v2-production-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/search-share-v2
          fetch-depth: 0

      - name: Generate production Search / Share v2
        run: >
          node tools/generate-work-search-pages.cjs
          --env production
          --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
          --write

      - name: Verify deterministic output
        run: >
          node tools/generate-work-search-pages.cjs
          --env production
          --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
          --check

      - name: Reject CoffeeFactory leakage
        shell: bash
        run: |
          set -euo pipefail
          test ! -e en/w/coffee-factory/index.html
          ! grep -q "coffee-factory" sitemap.xml
          ! grep -q "coffee-factory" data/work-search-meta.js

      - name: Commit generated production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add w en/w sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git commit -m "Search: generate production multilingual pages"
          git push origin HEAD:release/search-share-v2
