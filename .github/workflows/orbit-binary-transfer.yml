name: Temporary ORBIT Binary Transfer

on:
  push:
    branches:
      - release/orbit-embedded
    paths:
      - ".github/workflows/orbit-binary-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: release/orbit-embedded
          fetch-depth: 0

      - name: Fetch pinned ORBIT binary assets from staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p works/orbit/sounds

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/SukimaStock/yumaniwa-town-staging/236b1308ea4693d368a05f547f0efce289236ef3/works/orbit/sounds/rebirth.wav" \
            -o works/orbit/sounds/rebirth.wav

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/SukimaStock/yumaniwa-town-staging/236b1308ea4693d368a05f547f0efce289236ef3/works/orbit/sounds/ambient_drone.wav" \
            -o works/orbit/sounds/ambient_drone.wav

          test "$(git hash-object works/orbit/sounds/rebirth.wav)" = "d786cc9608f947a000ae39979c3f5d90b80e3b75"
          test "$(git hash-object works/orbit/sounds/ambient_drone.wav)" = "6b66d0558ed14ede84621d8f5a0a9db11d8f9505"

      - name: Commit binary assets to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/orbit/sounds/rebirth.wav works/orbit/sounds/ambient_drone.wav

          if git diff --cached --quiet; then
            echo "Binary assets already present."
            exit 0
          fi

          git commit -m "Release: add ORBIT large audio assets"
          git push origin HEAD:release/orbit-embedded
