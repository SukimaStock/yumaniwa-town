name: ORBIT Release Candidate Validation

on:
  push:
    branches:
      - release/orbit-embedded
    paths:
      - ".github/workflows/orbit-release-candidate-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Fetch fixed release validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/SukimaStock/yumaniwa-town-staging/236b1308ea4693d368a05f547f0efce289236ef3/tools/release-validator.cjs" \
            -o tools/.orbit-release-validator.cjs
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/SukimaStock/yumaniwa-town-staging/236b1308ea4693d368a05f547f0efce289236ef3/town-scene-validation.js" \
            -o town-scene-validation.js

      - name: Validate production candidate
        shell: bash
        run: |
          set -euo pipefail
          node tools/.orbit-release-validator.cjs \
            --env production \
            --ids orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window \
            --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
