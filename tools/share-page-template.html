<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="description" content="{{DESCRIPTION}}">

  <title>{{PAGE_TITLE}}</title>
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <meta property="og:locale" content="ja_JP">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="湯間庭町">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE_URL}}">
  <meta property="og:image:secure_url" content="{{OG_IMAGE_URL}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE_URL}}">
  <meta name="twitter:image:alt" content="{{OG_IMAGE_ALT}}">

  <meta name="apple-mobile-web-app-title" content="{{APP_TITLE}}">
  <meta name="application-name" content="{{APP_TITLE}}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" sizes="180x180" href="{{ICON_180_PATH}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ICON_32_PATH}}">

  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-sYe-y0PqpZapFe6FJVlK2.js"></script>
  <script>
    window.plausible = window.plausible || function () {
      (window.plausible.q = window.plausible.q || []).push(arguments);
    };
    window.plausible.init = window.plausible.init || function (options) {
      window.plausible.o = options || {};
    };
    window.plausible.init();
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: {{THEME_COLOR}};
    }

    #work-frame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: {{THEME_COLOR}};
    }
  </style>
</head>
<body>
  <iframe
    id="work-frame"
    src="{{ENTRY_URL}}"
    title="{{APP_TITLE}}"
    allow="autoplay; fullscreen; gamepad; web-share; clipboard-write"
    allowfullscreen
  ></iframe>
</body>
</html>
