<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <title>SteamClock</title>
  <meta name="description" content="SteamClock — a steampunk analog and nixie clock by SukimaStock.">
  <meta name="theme-color" content="#100c0b">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://sukimastock.github.io/yumaniwa-town/?work=steamclock">

  <!-- Start the two largest above-the-fold images before the runtime scripts. -->
  <link rel="preload" as="image" href="./assets/background.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/dial.png" fetchpriority="high">

  <!-- Privacy-friendly analytics by Plausible. -->
  <script>
    (() => {
      const isStaging = /\/yumaniwa-town-staging(?:\/|$)/.test(window.location.pathname);
      if (isStaging) return;

      const isProduction =
        location.protocol === "https:" &&
        location.hostname === "sukimastock.github.io";

      if (!isProduction) return;

      window.plausible = window.plausible || function () {
        (window.plausible.q = window.plausible.q || []).push(arguments);
      };
      window.plausible.init = window.plausible.init || function (options) {
        window.plausible.o = options || {};
      };
      window.plausible.init();

      const script = document.createElement("script");
      script.async = true;
      script.src = "https://plausible.io/js/pa-sYe-y0PqpZapFe6FJVlK2.js";
      document.head.appendChild(script);
    })();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

  <!-- iPhone / iPad Home Screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SteamClock">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #100c0b;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 1;
      transition: opacity 120ms linear;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script src="codea-lite.js"></script>
  <script src="sukimastock-engine.js"></script>

  <!--
    Keep the first load focused on the clock itself. Decorative machinery starts
    only after the page load event, then fills in over a short interval.
  -->
  <script>
    (() => {
      const originalReadImage = window.readImage;
      const CodeaImageClass = window.CodeaImage;
      if (typeof originalReadImage !== "function" || typeof CodeaImageClass !== "function") return;

      const transparentPixel =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";

      const deferredAssets = new Map([
        ["assets/center_piece.png", 0],
        ["assets/gear1.png", 0],
        ["assets/gear2.png", 0],
        ["assets/pendulum.png", 0],
        ["assets/barometer_dial.png", 150],
        ["assets/barometer_needle.png", 150],
        ["assets/pipe_elbow.png", 300],
        ["assets/pipe_straight.png", 300],
        ["assets/valve.png", 300],
        ["assets/gauge_dummy.png", 300]
      ]);

      function afterPageLoad(callback, delay) {
        const run = () => window.setTimeout(callback, delay);
        if (document.readyState === "complete") {
          run();
        } else {
          window.addEventListener("load", run, { once: true });
        }
      }

      window.readImage = function steamClockReadImage(src) {
        const key = String(src);

        // Legacy asset: the current scene never draws it, so do not request it.
        if (key === "assets/spring.png") {
          return new CodeaImageClass(transparentPixel);
        }

        const delay = deferredAssets.get(key);
        if (delay === undefined) return originalReadImage(src);

        const image = new CodeaImageClass(transparentPixel);
        if (image.element && "fetchPriority" in image.element) {
          image.element.fetchPriority = "low";
        }

        afterPageLoad(() => {
          image.src = key;
          image.loaded = false;
          image.error = null;
          image.element.src = key;
        }, delay);

        return image;
      };
    })();
  </script>

  <script src="sketch.js"></script>

  <script>
    CodeaLite.start("gameCanvas");

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("SteamClock service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
